<script>
  // Minimal localStorage-backed shim matching the Claude artifact window.storage API shape
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem('ledger:' + key);
      if (v === null) throw new Error('not found');
      return { key, value: v, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem('ledger:' + key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem('ledger:' + key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith('ledger:' + (prefix || '')))
        .map(k => k.replace('ledger:', ''));
      return { keys };
    }
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

<script type="text/jsx-source" id="app-source">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ---------- tiny inline icon set (replaces lucide-react for standalone use) ----------
function Icon({ size = 16, style = {}, children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ color: style.color || 'currentColor', display: 'block', ...style }}>
      {children}
    </svg>
  );
}
const Plus = p => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;

const CatCart = p => <Icon {...p}><circle cx="9" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="21" r="1" fill="currentColor" stroke="none"/><path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 7H6"/></Icon>;
const CatHealth = p => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></Icon>;
const CatBook = p => <Icon {...p}><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v16H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 4.5V19"/></Icon>;
const CatPlane = p => <Icon {...p}><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></Icon>;
const CatGrad = p => <Icon {...p}><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 3 2 6 2s6-1 6-2v-5"/></Icon>;

const CatPaw = p => <Icon {...p}><circle cx="7" cy="9" r="1.8"/><circle cx="12" cy="6.5" r="1.8"/><circle cx="17" cy="9" r="1.8"/><path d="M12 12c-3.5 0-5.5 2.2-5.5 4.5A2.7 2.7 0 0 0 9.2 19c1 0 1.4-.5 2.8-.5s1.8.5 2.8.5a2.7 2.7 0 0 0 2.7-2.5c0-2.3-2-4.5-5.5-4.5z"/></Icon>;
const CatGift = p => <Icon {...p}><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 8h18M12 8v13"/><path d="M12 8c-1.5 0-4-1-4-3s1.5-3 2.5-3S12 4 12 8zM12 8c1.5 0 4-1 4-3s-1.5-3-2.5-3S12 4 12 8z"/></Icon>;
const CatBolt = p => <Icon {...p}><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></Icon>;
const CatWallet = p => <Icon {...p}><path d="M3 7h15a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11v3"/><circle cx="16" cy="13" r="1.4" fill="currentColor" stroke="none"/></Icon>;

const CATEGORY_ICONS = {
  home: CatHome, food: CatFood, car: CatCar, film: CatFilm, bulb: CatBulb, cart: CatCart,
  wallet: CatWallet, health: CatHealth, book: CatBook, plane: CatPlane, grad: CatGrad,
  shirt: CatShirt, phone: CatPhone, paw: CatPaw, gift: CatGift, bolt: CatBolt,
};

// ---------- design tokens ----------
const C = {
  base: '#14161A', surface: '#1B1E23', surface2: '#22262C',
  border: '#2B3037', borderSoft: '#22262C',
  text: '#EDEEF0', muted: '#8B9099', faint: '#565C66',
  positive: '#4ADE9C', warning: '#F5B049', danger: '#F0665A',
  sky: '#5FB4E8', violet: '#B18CF0',
};
const SWATCHES = ['#4ADE9C', '#5FB4E8', '#B18CF0', '#F5B049', '#F0665A', '#F17FB3', '#7DD3FC', '#FCD34D'];
const ICONS = ['\uD83C\uDFE0', '\uD83C\uDF54', '\uD83D\uDE97', '\uD83C\uDFAC', '\uD83D\uDCA1', '\uD83D\uDED2', '\uD83D\uDCB0', '\uD83C\uDFE5', '\uD83D\uDCDA', '\u2708\uFE0F', '\uD83C\uDF93', '\uD83D\uDC55', '\uD83D\uDCF1', '\uD83D\uDC3E', '\uD83C\uDF81', '\u26A1'];
const DEFAULT_CATEGORIES = [
  { id: 'household', name: 'Household', color: '#4ADE9C', limit: 0, icon: ICONS[0], subcategories: [] },
  { id: 'entertainment', name: 'Entertainment', color: '#B18CF0', limit: 0, icon: ICONS[3], subcategories: [] },
  { id: 'food', name: 'Food & Dining', color: '#F5B049', limit: 0, icon: ICONS[1], subcategories: [] },
  { id: 'transport', name: 'Transport', color: '#5FB4E8', limit: 0, icon: ICONS[2], subcategories: [] },
];

// ---------- date helpers ----------
const pad = n => String(n).padStart(2, '0');
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const monthKeyOf = k => k.slice(0, 7);
const startOfWeek = d => { const nd = new Date(d); const day = (nd.getDay() + 6) % 7; nd.setDate(nd.getDate() - day); return nd; };
const todayKey = toKey(new Date());
const yesterdayKey = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return toKey(d); })();
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function dayLabel(key) {
  if (key === todayKey) return 'Today';
  if (key === yesterdayKey) return 'Yesterday';
  const d = parseKey(key);
  return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
}
function weekLabel(key) {
  const start = parseKey(key);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const sameMonth = start.getMonth() === end.getMonth();
  return `${start.getDate()} ${sameMonth ? '' : MONTHS[start.getMonth()].slice(0,3)+' '}\u2013 ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}`;
}
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return `${MONTHS[m - 1]} ${y}`;
}
const fmt = n => '\u20B9' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

async function loadKey(key, fallback) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
  catch (e) { return fallback; }
}
async function saveKey(key, value) {
  try { await window.storage.set(key, JSON.stringify(value)); } catch (e) {}
}

function Ledger() {
  const [loaded, setLoaded] = useState(false);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [expenses, setExpenses] = useState([]);
  const [balance, setBalance] = useState(null);

  const [tab, setTab] = useState('home');
  const awayFromHomeRef = useRef(false);

  const goToTab = useCallback((t) => {
    if (t === 'home') {
      awayFromHomeRef.current = false;
      setTab('home');
    } else {
      if (!awayFromHomeRef.current) {
        window.history.pushState({ ledgerNav: true }, '', '#app');
        awayFromHomeRef.current = true;
      }
      setTab(t);
    }
  }, []);

  useEffect(() => {
    const handlePop = () => {
      awayFromHomeRef.current = false;
      setTab('home');
    };
    window.addEventListener('popstate', handlePop);
    return () => window.removeEventListener('popstate', handlePop);
  }, []);
  const [groupBy, setGroupBy] = useState('day');
  const [calMonth, setCalMonth] = useState(new Date());
  const [selectedDay, setSelectedDay] = useState(todayKey);

  const [showAdd, setShowAdd] = useState(false);
  const [addPrefillDate, setAddPrefillDate] = useState(todayKey);
  const [showBalance, setShowBalance] = useState(false);
  const [showAddMoney, setShowAddMoney] = useState(null); // null | { mode: 'balance' } | { mode: 'category', category }
  const [catModal, setCatModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [notifyFlags, setNotifyFlags] = useState({});
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
  );

  useEffect(() => {
    (async () => {
      const [cats, exps, settings, flags] = await Promise.all([
        loadKey('categories', DEFAULT_CATEGORIES),
        loadKey('expenses', []),
        loadKey('settings', { balance: null }),
        loadKey('notifyFlags', {}),
      ]);
      setCategories(cats); setExpenses(exps); setBalance(settings.balance);
      setNotifyFlags(flags);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) saveKey('categories', categories); }, [categories, loaded]);
  useEffect(() => { if (loaded) saveKey('expenses', expenses); }, [expenses, loaded]);
  useEffect(() => { if (loaded) saveKey('settings', { balance }); }, [balance, loaded]);
  useEffect(() => { if (loaded) saveKey('notifyFlags', notifyFlags); }, [notifyFlags, loaded]);

  const showToast = useCallback((type, msg) => {
    setToast({ type, msg, id: uid() });
    setTimeout(() => setToast(t => (t && t.msg === msg ? null : t)), 3800);
  }, []);

  const requestNotifications = useCallback(() => {
    if (typeof Notification === 'undefined') return;
    Notification.requestPermission().then(p => setNotifPermission(p));
  }, []);

  const sendSystemNotification = useCallback(async (title, body, tag) => {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png', tag });
      } else {
        new Notification(title, { body, icon: 'icon-192.png' });
      }
    } catch (e) { /* notifications not available, ignore */ }
  }, []);

  const maybeNotify = useCallback((key, condition, title, body) => {
    if (!condition || notifyFlags[key]) return;
    sendSystemNotification(title, body, key);
    setNotifyFlags(prev => ({ ...prev, [key]: true }));
  }, [notifyFlags, sendSystemNotification]);

  const getCategory = useCallback(id => categories.find(c => c.id === id) || { name: 'Uncategorized', color: C.faint, limit: 0, icon: '\uD83D\uDCB8', subcategories: [] }, [categories]);
  const getSubcategoryName = useCallback((cat, subId) => {
    if (!subId || !cat || !cat.subcategories) return null;
    const s = cat.subcategories.find(x => x.id === subId);
    return s ? s.name : null;
  }, []);

  const thisMonthKey = monthKeyOf(todayKey);
  const spentInMonth = useCallback((mKey, categoryId) => expenses
    .filter(e => monthKeyOf(e.date) === mKey && (!categoryId || e.categoryId === categoryId))
    .reduce((s, e) => s + (e.type === 'credit' ? -Number(e.amount) : Number(e.amount)), 0), [expenses]);

  const spentThisMonth = spentInMonth(thisMonthKey);
  const remaining = balance === null ? null : balance - spentThisMonth;

  // Watch category spend and push a phone notification the moment a limit is crossed
  useEffect(() => {
    if (!loaded) return;
    categories.forEach(cat => {
      if (!cat.limit || cat.limit <= 0) return;
      const spent = spentInMonth(thisMonthKey, cat.id);
      const pct = spent / cat.limit;
      maybeNotify(`category:${cat.id}:${thisMonthKey}:100`, pct >= 1,
        `Over budget: ${cat.name}`, `You've spent ${fmt(spent)} of your ${fmt(cat.limit)} limit this month.`);
      maybeNotify(`category:${cat.id}:${thisMonthKey}:80`, pct >= 0.8 && pct < 1,
        `Nearing your ${cat.name} limit`, `You've used ${Math.round(pct * 100)}% of this month's ${fmt(cat.limit)} budget.`);
    });
  }, [expenses, categories, loaded, thisMonthKey]);

  // Watch overall balance and push a phone notification when it's running low or gone
  useEffect(() => {
    if (!loaded || balance === null || balance <= 0) return;
    maybeNotify(`balance:${thisMonthKey}:zero`, remaining <= 0,
      'Balance used up', `You've spent your full balance of ${fmt(balance)} for this month.`);
    maybeNotify(`balance:${thisMonthKey}:low`, remaining > 0 && remaining <= balance * 0.15,
      'Balance running low', `Only ${fmt(remaining)} left out of ${fmt(balance)} this month.`);
  }, [expenses, balance, loaded, thisMonthKey]);

  function addExpense({ amount, categoryId, subcategoryId, note, date, time }) {
    const amt = Number(amount);
    if (!amt || amt <= 0) return;
    const entry = { id: uid(), amount: amt, categoryId, subcategoryId: subcategoryId || null, note: note.trim(), date, time };
    setExpenses(prev => [...prev, entry]);
    const cat = getCategory(categoryId);
    if (cat.limit > 0) {
      const mKey = monthKeyOf(date);
      const total = spentInMonth(mKey, categoryId) + amt;
      const pct = total / cat.limit;
      if (pct >= 1) showToast('danger', `Over the limit on ${cat.name} \u2014 ${fmt(total)} of ${fmt(cat.limit)}`);
      else if (pct >= 0.8) showToast('warning', `Nearing your ${cat.name} limit \u2014 ${Math.round(pct * 100)}% used`);
    }
    setShowAdd(false);
  }
  function deleteExpense(id) { setExpenses(prev => prev.filter(e => e.id !== id)); }

  function addMoneyToBalance(amount) {
    const amt = Number(amount);
    if (!amt || amt <= 0) return;
    setBalance(prev => (prev || 0) + amt);
    setShowAddMoney(null);
  }

  function addMoneyToCategory(categoryId, amount, note) {
    const amt = Number(amount);
    if (!amt || amt <= 0) return;
    const entry = { id: uid(), amount: amt, categoryId, subcategoryId: null, note: (note || 'Money added').trim(), date: todayKey, time: `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`, type: 'credit' };
    setExpenses(prev => [...prev, entry]);
    setShowAddMoney(null);
  }

  function saveCategory(cat) {
    setCategories(prev => {
      const exists = prev.some(c => c.id === cat.id);
      return exists ? prev.map(c => (c.id === cat.id ? cat : c)) : [...prev, cat];
    });
    setCatModal(null);
  }
  function deleteCategory(id) { setCategories(prev => prev.filter(c => c.id !== id)); setCatModal(null); }

  const grouped = useMemo(() => {
    const sorted = [...expenses].sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : -1));
    const map = new Map();
    for (const e of sorted) {
      let key;
      if (groupBy === 'day') key = e.date;
      else if (groupBy === 'week') key = toKey(startOfWeek(parseKey(e.date)));
      else key = monthKeyOf(e.date);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(e);
    }
    return [...map.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1));
  }, [expenses, groupBy]);

  const groupLabel = key => (groupBy === 'day' ? dayLabel(key) : groupBy === 'week' ? weekLabel(key) : monthLabel(key));
  const recent = useMemo(() => [...expenses].sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : -1)).slice(0, 5), [expenses]);

  const calDays = useMemo(() => {
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const totals = {}; let maxDay = 0;
    expenses.forEach(e => {
      if (e.date.startsWith(`${y}-${pad(m + 1)}`)) {
        totals[e.date] = (totals[e.date] || 0) + Number(e.amount);
        if (totals[e.date] > maxDay) maxDay = totals[e.date];
      }
    });
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${y}-${pad(m + 1)}-${pad(d)}`;
      cells.push({ key, d, total: totals[key] || 0 });
    }
    return { cells, maxDay };
  }, [calMonth, expenses]);

  const monthStats = useMemo(() => {
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const mKey = `${y}-${pad(m + 1)}`;
    const total = spentInMonth(mKey);
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const isCurrentMonth = mKey === thisMonthKey;
    const elapsedDays = isCurrentMonth ? new Date().getDate() : daysInMonth;
    const avgDaily = elapsedDays > 0 ? total / elapsedDays : 0;

    const totals = {};
    expenses.forEach(e => { if (monthKeyOf(e.date) === mKey) totals[e.date] = (totals[e.date] || 0) + Number(e.amount); });
    let highestDate = null, highestAmt = 0;
    Object.entries(totals).forEach(([d, amt]) => { if (amt > highestAmt) { highestAmt = amt; highestDate = d; } });

    const prevRef = new Date(y, m - 1, 1);
    const prevKey = `${prevRef.getFullYear()}-${pad(prevRef.getMonth() + 1)}`;
    const prevTotal = spentInMonth(prevKey);
    const change = prevTotal > 0 ? ((total - prevTotal) / prevTotal) * 100 : null;

    return { total, avgDaily, highestDate, highestAmt, change };
  }, [calMonth, expenses]);

  const dayEntries = useMemo(() => expenses.filter(e => e.date === selectedDay).sort((a, b) => (a.time < b.time ? 1 : -1)), [expenses, selectedDay]);

  if (!loaded) {
    return <div style={{ background: C.base, color: C.muted }} className="min-h-screen flex items-center justify-center font-sans text-sm">{'Opening your paisa book\u2026'}</div>;
  }

  return (
    <div style={{ background: C.base }} className="min-h-screen flex justify-center font-sans">
      <div style={{ color: C.text }} className="w-full max-w-md relative min-h-screen pb-28">

        {toast && (
          <div className="fixed top-3 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-50">
            <div style={{ background: C.surface2, borderLeft: `3px solid ${toast.type === 'danger' ? C.danger : C.warning}` }}
              className="flex items-start gap-2 rounded-lg px-3 py-2.5 shadow-lg">
              <AlertTriangle size={16} style={{ color: toast.type === 'danger' ? C.danger : C.warning, marginTop: 2, flexShrink: 0 }} />
              <span className="text-xs leading-snug" style={{ color: C.text }}>{toast.msg}</span>
            </div>
          </div>
        )}

        <div className="px-5 pt-6 pb-2 flex items-center justify-between">
          <div>
            <div style={{ color: C.faint, letterSpacing: '0.12em' }} className="text-[10px] font-semibold uppercase">Personal Finance</div>
            <div className="text-xl font-bold" style={{ color: C.text }}>Paisa Book</div>
          </div>
          <button onClick={() => setShowBalance(true)} style={{ background: C.surface, border: `1px solid ${C.border}` }} className="p-2.5 rounded-full">
            <Wallet size={17} style={{ color: C.positive }} />
          </button>
        </div>

        {tab === 'home' && (
          <div className="px-5 mt-3 flex flex-col gap-5">
            {notifPermission === 'default' && (
              <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="rounded-xl px-4 py-3 flex items-center gap-3">
                <Bell size={18} style={{ color: C.positive, flexShrink: 0 }} />
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-medium" style={{ color: C.text }}>Get alerts on your phone</div>
                  <div className="text-[11px]" style={{ color: C.faint }}>Nearing a limit or running low on balance</div>
                </div>
                <button onClick={requestNotifications} style={{ background: C.positive, color: C.base }} className="text-xs font-semibold px-3 py-1.5 rounded-full flex-shrink-0">Enable</button>
              </div>
            )}
            {notifPermission === 'denied' && (
              <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="rounded-xl px-4 py-3 flex items-center gap-3">
                <Bell size={18} style={{ color: C.faint, flexShrink: 0 }} />
                <div className="text-[11px]" style={{ color: C.faint }}>Notifications are blocked. Enable them for this app in your phone's Settings to get limit and balance alerts.</div>
              </div>
            )}

            <div style={{ background: C.surface, border: `1px dashed ${C.border}` }} className="rounded-2xl p-5">
              {balance === null ? (
                <div onClick={() => setShowBalance(true)} className="flex flex-col items-center text-center gap-1 py-2 cursor-pointer">
                  <Wallet size={20} style={{ color: C.muted }} />
                  <div className="text-sm mt-1" style={{ color: C.muted }}>Set your account balance to start tracking</div>
                  <div className="text-xs" style={{ color: C.positive }}>Tap to set balance</div>
                </div>
              ) : (
                <React.Fragment>
                  <div className="flex items-start justify-between">
                    <div onClick={() => setShowBalance(true)} className="cursor-pointer">
                      <div style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider mb-1">Remaining</div>
                      <div className="font-mono text-3xl font-semibold" style={{ color: remaining < 0 ? C.danger : remaining < balance * 0.15 ? C.warning : C.positive }}>{fmt(remaining)}</div>
                    </div>
                    <button onClick={() => setShowAddMoney({ mode: 'balance' })} style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.positive }} className="flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-full flex-shrink-0">
                      <Plus size={13} /> Add money
                    </button>
                  </div>
                  <div className="flex items-center justify-between mt-4 pt-4" style={{ borderTop: `1px solid ${C.border}` }}>
                    <div onClick={() => setShowBalance(true)} className="cursor-pointer">
                      <div style={{ color: C.faint }} className="text-[10px] uppercase tracking-wider">Starting balance</div>
                      <div className="font-mono text-sm mt-0.5" style={{ color: C.text }}>{fmt(balance)}</div>
                    </div>
                    <div className="text-right">
                      <div style={{ color: C.faint }} className="text-[10px] uppercase tracking-wider">Spent this month</div>
                      <div className="font-mono text-sm mt-0.5" style={{ color: C.text }}>{fmt(spentThisMonth)}</div>
                    </div>
                  </div>
                </React.Fragment>
              )}
            </div>

            {categories.length > 0 && (
              <div>
                <div className="flex items-center justify-between mb-2 px-1">
                  <div style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Categories this month</div>
                </div>
                <div className="flex flex-col gap-2">
                  {categories.map(cat => {
                    const spent = spentInMonth(thisMonthKey, cat.id);
                    const pct = cat.limit > 0 ? Math.min(spent / cat.limit, 1) : 0;
                    const barColor = pct >= 1 ? C.danger : pct >= 0.8 ? C.warning : cat.color;
                    return (
                      <div key={cat.id} style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="rounded-xl px-3.5 py-3">
                        <div className="flex items-center justify-between mb-1.5">
                          <div className="flex items-center gap-2.5">
                            <IconBadge icon={cat.icon} color={cat.color} size={26} />
                            <span className="text-sm font-medium">{cat.name}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-xs" style={{ color: C.muted }}>{fmt(spent)}{cat.limit > 0 ? ` / ${fmt(cat.limit)}` : ''}</span>
                            <button onClick={() => setShowAddMoney({ mode: 'category', category: cat })} style={{ color: C.positive }} className="p-0.5"><Plus size={14} /></button>
                          </div>
                        </div>
                        {cat.limit > 0 && (
                          <div style={{ background: C.surface2, height: 5, borderRadius: 999, overflow: 'hidden' }}>
                            <div style={{ width: `${pct * 100}%`, background: barColor, height: '100%', borderRadius: 999 }}></div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div>
              <div style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider mb-2 px-1">Recent activity</div>
              {recent.length === 0 ? <EmptyState text="No entries yet. Log your first expense below." /> : (
                <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="rounded-xl divide-y">
                  {recent.map(e => { const c = getCategory(e.categoryId); return <ExpenseRow key={e.id} e={e} cat={c} sub={getSubcategoryName(c, e.subcategoryId)} onDelete={() => deleteExpense(e.id)} />; })}
                </div>
              )}
            </div>
          </div>
        )}

        {tab === 'ledger' && (
          <div className="px-5 mt-3">
            <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="flex rounded-full p-1 mb-4">
              {['day', 'week', 'month'].map(g => (
                <button key={g} onClick={() => setGroupBy(g)}
                  style={{ background: groupBy === g ? C.surface2 : 'transparent', color: groupBy === g ? C.text : C.muted }}
                  className="flex-1 text-xs font-medium py-1.5 rounded-full capitalize transition-colors">{g}</button>
              ))}
            </div>
            {grouped.length === 0 ? <EmptyState text="No expenses logged yet." /> : (
              <div className="flex flex-col gap-4">
                {grouped.map(([key, items]) => {
                  const total = items.reduce((s, e) => s + Number(e.amount), 0);
                  return (
                    <div key={key}>
                      <div className="flex items-center justify-between mb-1.5 px-1">
                        <span className="text-xs font-semibold" style={{ color: C.text }}>{groupLabel(key)}</span>
                        <span className="font-mono text-xs" style={{ color: C.muted }}>{fmt(total)}</span>
                      </div>
                      <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="rounded-xl divide-y">
                        {items.map(e => { const c = getCategory(e.categoryId); return <ExpenseRow key={e.id} e={e} cat={c} sub={getSubcategoryName(c, e.subcategoryId)} onDelete={() => deleteExpense(e.id)} showDate={groupBy !== 'day'} />; })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab === 'calendar' && (
          <div className="px-5 mt-3">
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => setCalMonth(m => new Date(m.getFullYear(), m.getMonth() - 1, 1))} style={{ background: C.surface, border: `1px solid ${C.border}` }} className="p-2 rounded-full"><ChevronLeft size={16} /></button>
              <span className="text-sm font-semibold">{MONTHS[calMonth.getMonth()]} {calMonth.getFullYear()}</span>
              <button onClick={() => setCalMonth(m => new Date(m.getFullYear(), m.getMonth() + 1, 1))} style={{ background: C.surface, border: `1px solid ${C.border}` }} className="p-2 rounded-full"><ChevronRight size={16} /></button>
            </div>
            <div className="grid grid-cols-7 gap-1 mb-1">
              {WEEKDAYS.map(w => <div key={w} className="text-center text-[10px] font-medium" style={{ color: C.faint }}>{w}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {calDays.cells.map((cell, i) => {
                if (!cell) return <div key={i}></div>;
                const isSelected = cell.key === selectedDay;
                const isToday = cell.key === todayKey;
                const intensity = calDays.maxDay > 0 ? cell.total / calDays.maxDay : 0;
                return (
                  <button key={cell.key} onClick={() => setSelectedDay(cell.key)}
                    style={{ background: isSelected ? C.surface2 : 'transparent', border: isSelected ? `1px solid ${C.positive}` : isToday ? `1px solid ${C.border}` : '1px solid transparent' }}
                    className="aspect-square rounded-lg flex flex-col items-center justify-center gap-0.5">
                    <span className="text-xs" style={{ color: isSelected ? C.text : C.muted }}>{cell.d}</span>
                    {cell.total > 0 && <span style={{ width: 4, height: 4, borderRadius: 999, background: intensity > 0.66 ? C.danger : intensity > 0.33 ? C.warning : C.positive }}></span>}
                  </button>
                );
              })}
            </div>

            <div className="mt-5 rounded-xl px-4 py-4" style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }}>
              <div style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Monthly spend</div>
              <div className="flex items-end gap-2 mt-1">
                <span className="font-mono text-2xl font-semibold" style={{ color: C.text }}>{fmt(monthStats.total)}</span>
                {monthStats.change !== null && (
                  <span className="text-xs font-medium mb-1" style={{ color: monthStats.change >= 0 ? C.danger : C.positive }}>
                    {monthStats.change >= 0 ? '\u25B2' : '\u25BC'} {Math.abs(Math.round(monthStats.change))}%
                  </span>
                )}
                {monthStats.change === null && monthStats.total > 0 && (
                  <span className="text-xs font-medium mb-1" style={{ color: C.faint }}>New</span>
                )}
              </div>
              <div style={{ color: C.faint }} className="text-[10px] mt-0.5">vs last month</div>
            </div>
            <div className="flex gap-3 mt-3">
              <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="flex-1 rounded-xl px-4 py-3">
                <div style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Highest day</div>
                <div className="font-mono text-sm font-semibold mt-1" style={{ color: monthStats.highestDate ? C.warning : C.faint }}>
                  {monthStats.highestDate ? dayLabel(monthStats.highestDate) : '\u2014'}
                </div>
                {monthStats.highestDate && <div className="text-[11px] mt-0.5" style={{ color: C.muted }}>{fmt(monthStats.highestAmt)}</div>}
              </div>
              <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="flex-1 rounded-xl px-4 py-3">
                <div style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Avg daily</div>
                <div className="font-mono text-sm font-semibold mt-1" style={{ color: C.text }}>{fmt(monthStats.avgDaily)}</div>
              </div>
            </div>

            <div className="mt-5">
              <div className="flex items-center justify-between mb-2 px-1">
                <span className="text-xs font-semibold">{dayLabel(selectedDay)}</span>
                <button onClick={() => { setAddPrefillDate(selectedDay); setShowAdd(true); }} className="flex items-center gap-1 text-xs font-medium" style={{ color: C.positive }}>
                  <Plus size={13} /> Add entry
                </button>
              </div>
              {dayEntries.length === 0 ? <EmptyState text="Nothing logged for this day." small /> : (
                <div style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="rounded-xl divide-y">
                  {dayEntries.map(e => { const c = getCategory(e.categoryId); return <ExpenseRow key={e.id} e={e} cat={c} sub={getSubcategoryName(c, e.subcategoryId)} onDelete={() => deleteExpense(e.id)} />; })}
                </div>
              )}
            </div>
          </div>
        )}

        {tab === 'categories' && (
          <div className="px-5 mt-3">
            <div className="flex flex-col gap-2 mb-4">
              {categories.map(cat => {
                const spent = spentInMonth(thisMonthKey, cat.id);
                return (
                  <div key={cat.id} onClick={() => setCatModal(cat)} style={{ background: C.surface, border: `1px solid ${C.borderSoft}` }} className="rounded-xl px-4 py-3 flex items-center justify-between cursor-pointer">
                    <div className="flex items-center gap-3">
                      <IconBadge icon={cat.icon} color={cat.color} size={36} />
                      <div>
                        <div className="text-sm font-medium">{cat.name}</div>
                        <div className="text-[11px]" style={{ color: C.faint }}>
                          {[cat.limit > 0 ? `Limit ${fmt(cat.limit)}/mo` : 'No limit set', cat.subcategories && cat.subcategories.length > 0 ? `${cat.subcategories.length} subcategories` : null].filter(Boolean).join(' \u00b7 ')}
                        </div>
                      </div>
                    </div>
                    <div className="text-right flex items-center gap-2">
                      <span className="font-mono text-xs" style={{ color: C.muted }}>{fmt(spent)}</span>
                      <button onClick={e => { e.stopPropagation(); setShowAddMoney({ mode: 'category', category: cat }); }} style={{ color: C.positive }} className="p-0.5"><Plus size={14} /></button>
                      <Pencil size={13} style={{ color: C.faint }} />
                    </div>
                  </div>
                );
              })}
            </div>
            <button onClick={() => setCatModal('new')} style={{ border: `1px dashed ${C.border}`, color: C.muted }} className="w-full rounded-xl py-3 text-sm font-medium flex items-center justify-center gap-1.5">
              <Plus size={15} /> New category
            </button>
          </div>
        )}

        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-40">
          <div style={{ background: C.surface, borderTop: `1px solid ${C.border}` }} className="flex items-center justify-around px-2 pt-2 pb-4 relative">
            <NavBtn icon={HomeIcon} label="Home" active={tab === 'home'} onClick={() => goToTab('home')} />
            <NavBtn icon={List} label="Ledger" active={tab === 'ledger'} onClick={() => goToTab('ledger')} />
            <div className="w-14"></div>
            <NavBtn icon={CalendarIcon} label="Calendar" active={tab === 'calendar'} onClick={() => goToTab('calendar')} />
            <NavBtn icon={Tag} label="Categories" active={tab === 'categories'} onClick={() => goToTab('categories')} />
            <button onClick={() => { setAddPrefillDate(todayKey); setShowAdd(true); }} style={{ background: C.positive }}
              className="absolute left-1/2 -translate-x-1/2 -top-5 w-14 h-14 rounded-full flex items-center justify-center shadow-lg">
              <Plus size={24} style={{ color: C.base }} />
            </button>
          </div>
        </div>

        {showAdd && <AddExpenseModal categories={categories} defaultDate={addPrefillDate} onClose={() => setShowAdd(false)} onSave={addExpense} />}
        {showBalance && <BalanceModal current={balance} onClose={() => setShowBalance(false)} onSave={v => { setBalance(v); setShowBalance(false); }} />}
        {showAddMoney && (
          <AddMoneyModal
            target={showAddMoney}
            onClose={() => setShowAddMoney(null)}
            onSaveBalance={addMoneyToBalance}
            onSaveCategory={addMoneyToCategory}
          />
        )}
        {catModal && <CategoryModal category={catModal === 'new' ? null : catModal} onClose={() => setCatModal(null)} onSave={saveCategory} onDelete={catModal !== 'new' ? () => deleteCategory(catModal.id) : null} />}
      </div>
    </div>
  );
}

function NavBtn({ icon: IconComp, label, active, onClick }) {
  return (
    <button onClick={onClick} className="flex flex-col items-center gap-0.5 px-2 pt-1">
      <IconComp size={19} style={{ color: active ? C.positive : C.faint }} />
      <span style={{ color: active ? C.positive : C.faint }} className="text-[9px] font-medium">{label}</span>
    </button>
  );
}
function EmptyState({ text, small }) {
  return <div style={{ border: `1px dashed ${C.border}`, color: C.faint }} className={`rounded-xl flex items-center justify-center text-center ${small ? 'py-6 text-xs' : 'py-10 text-sm'}`}>{text}</div>;
}
function IconBadge({ icon, color, size = 32 }) {
  return (
    <div style={{ background: color + '26', width: size, height: size, borderRadius: size * 0.32, flexShrink: 0 }} className="flex items-center justify-center">
      <span style={{ fontSize: size * 0.5, lineHeight: 1 }}>{icon || '\uD83D\uDCB8'}</span>
    </div>
  );
}
function ExpenseRow({ e, cat, sub, onDelete, showDate }) {
  const [confirm, setConfirm] = useState(false);
  const isCredit = e.type === 'credit';
  const meta = [cat.name, sub, showDate ? dayLabel(e.date) : null, e.time].filter(Boolean).join(' \u00b7 ');
  return (
    <div className="flex items-center justify-between px-3.5 py-3">
      <div className="flex items-center gap-3 min-w-0">
        <IconBadge icon={cat.icon} color={cat.color} size={30} />
        <div className="min-w-0">
          <div className="text-sm truncate" style={{ color: C.text }}>{e.note || cat.name}</div>
          <div className="text-[11px] truncate" style={{ color: C.faint }}>{meta}</div>
        </div>
      </div>
      <div className="flex items-center gap-2 flex-shrink-0">
        <span className="font-mono text-sm font-medium" style={{ color: isCredit ? C.positive : C.text }}>{isCredit ? '+' : ''}{fmt(e.amount)}</span>
        {confirm ? <button onClick={onDelete} className="text-[10px] font-semibold px-1.5" style={{ color: C.danger }}>Confirm</button>
          : <button onClick={() => setConfirm(true)}><Trash2 size={13} style={{ color: C.faint }} /></button>}
      </div>
    </div>
  );
}
function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center">
      <div onClick={onClose} style={{ background: 'rgba(0,0,0,0.55)' }} className="absolute inset-0"></div>
      <div style={{ background: C.surface, borderTop: `1px solid ${C.border}` }} className="relative w-full max-w-md rounded-t-2xl px-5 pt-4 pb-8 max-h-[88vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <span className="text-sm font-semibold">{title}</span>
          <button onClick={onClose}><X size={18} style={{ color: C.muted }} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}
function AddExpenseModal({ categories, defaultDate, onClose, onSave }) {
  const [amount, setAmount] = useState('');
  const [categoryId, setCategoryId] = useState(categories[0] ? categories[0].id : '');
  const [subcategoryId, setSubcategoryId] = useState('');
  const [note, setNote] = useState('');
  const [date, setDate] = useState(defaultDate);
  const now = new Date();
  const [time, setTime] = useState(`${pad(now.getHours())}:${pad(now.getMinutes())}`);
  const selectedCat = categories.find(c => c.id === categoryId);
  const subOptions = (selectedCat && selectedCat.subcategories) || [];

  function pickCategory(id) {
    setCategoryId(id);
    setSubcategoryId('');
  }

  return (
    <Sheet title="Log an expense" onClose={onClose}>
      <div className="flex flex-col gap-4">
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Amount</label>
          <div className="flex items-center mt-1.5">
            <span className="font-mono text-2xl mr-1.5" style={{ color: C.muted }}>{'\u20B9'}</span>
            <input type="number" inputMode="decimal" autoFocus placeholder="0" value={amount} onChange={e => setAmount(e.target.value)}
              style={{ background: 'transparent', color: C.text }} className="font-mono text-2xl font-semibold w-full outline-none" />
          </div>
          <div style={{ height: 1, background: C.border }} className="mt-1"></div>
        </div>
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Category</label>
          <div className="flex flex-wrap gap-2 mt-1.5">
            {categories.map(c => (
              <button key={c.id} onClick={() => pickCategory(c.id)}
                style={{ background: categoryId === c.id ? c.color : C.surface2, color: categoryId === c.id ? C.base : C.text, border: `1px solid ${categoryId === c.id ? c.color : C.border}` }}
                className="px-3 py-1.5 rounded-full text-xs font-medium">{c.icon ? c.icon + ' ' : ''}{c.name}</button>
            ))}
          </div>
        </div>
        {subOptions.length > 0 && (
          <div>
            <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Subcategory</label>
            <div className="flex flex-wrap gap-2 mt-1.5">
              <button onClick={() => setSubcategoryId('')}
                style={{ background: subcategoryId === '' ? C.text : C.surface2, color: subcategoryId === '' ? C.base : C.muted, border: `1px solid ${subcategoryId === '' ? C.text : C.border}` }}
                className="px-3 py-1.5 rounded-full text-xs font-medium">General</button>
              {subOptions.map(s => (
                <button key={s.id} onClick={() => setSubcategoryId(s.id)}
                  style={{ background: subcategoryId === s.id ? selectedCat.color : C.surface2, color: subcategoryId === s.id ? C.base : C.text, border: `1px solid ${subcategoryId === s.id ? selectedCat.color : C.border}` }}
                  className="px-3 py-1.5 rounded-full text-xs font-medium">{s.name}</button>
              ))}
            </div>
          </div>
        )}
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">What was it for?</label>
          <input type="text" placeholder="e.g. Groceries, Movie tickets" value={note} onChange={e => setNote(e.target.value)}
            style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }} className="w-full mt-1.5 rounded-lg px-3 py-2.5 text-sm outline-none" />
        </div>
        <div className="flex gap-3">
          <div className="flex-1">
            <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Date</label>
            <input type="date" value={date} onChange={e => setDate(e.target.value)}
              style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}`, colorScheme: 'dark' }} className="w-full mt-1.5 rounded-lg px-3 py-2.5 text-sm outline-none" />
          </div>
          <div className="flex-1">
            <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Time</label>
            <input type="time" value={time} onChange={e => setTime(e.target.value)}
              style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}`, colorScheme: 'dark' }} className="w-full mt-1.5 rounded-lg px-3 py-2.5 text-sm outline-none" />
          </div>
        </div>
        <button onClick={() => onSave({ amount, categoryId, subcategoryId, note, date, time })} disabled={!amount || Number(amount) <= 0 || !categoryId}
          style={{ background: (!amount || Number(amount) <= 0) ? C.surface2 : C.positive, color: (!amount || Number(amount) <= 0) ? C.faint : C.base }}
          className="w-full py-3 rounded-xl text-sm font-semibold mt-1">Save entry</button>
      </div>
    </Sheet>
  );
}
function BalanceModal({ current, onClose, onSave }) {
  const [val, setVal] = useState(current === null ? '' : String(current));
  return (
    <Sheet title="Account balance" onClose={onClose}>
      <div className="flex flex-col gap-4">
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Current balance</label>
          <div className="flex items-center mt-1.5">
            <span className="font-mono text-2xl mr-1.5" style={{ color: C.muted }}>{'\u20B9'}</span>
            <input type="number" inputMode="decimal" autoFocus placeholder="0" value={val} onChange={e => setVal(e.target.value)}
              style={{ background: 'transparent', color: C.text }} className="font-mono text-2xl font-semibold w-full outline-none" />
          </div>
          <div style={{ height: 1, background: C.border }} className="mt-1"></div>
          <div className="text-[11px] mt-2" style={{ color: C.faint }}>This is used to work out what's left after expenses each month.</div>
        </div>
        <button onClick={() => onSave(Number(val) || 0)} style={{ background: C.positive, color: C.base }} className="w-full py-3 rounded-xl text-sm font-semibold">Save balance</button>
      </div>
    </Sheet>
  );
}
function AddMoneyModal({ target, onClose, onSaveBalance, onSaveCategory }) {
  const [amount, setAmount] = useState('');
  const [note, setNote] = useState('');
  const isCategory = target.mode === 'category';
  const cat = isCategory ? target.category : null;

  function handleSave() {
    if (isCategory) onSaveCategory(cat.id, amount, note);
    else onSaveBalance(amount);
  }

  return (
    <Sheet title={isCategory ? `Add money to ${cat.name}` : 'Add money to balance'} onClose={onClose}>
      <div className="flex flex-col gap-4">
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Amount</label>
          <div className="flex items-center mt-1.5">
            <span className="font-mono text-2xl mr-1.5" style={{ color: C.muted }}>{'\u20B9'}</span>
            <input type="number" inputMode="decimal" autoFocus placeholder="0" value={amount} onChange={e => setAmount(e.target.value)}
              style={{ background: 'transparent', color: C.text }} className="font-mono text-2xl font-semibold w-full outline-none" />
          </div>
          <div style={{ height: 1, background: C.border }} className="mt-1"></div>
          <div className="text-[11px] mt-2" style={{ color: C.faint }}>
            {isCategory
              ? `This is added as a credit, so it reduces how much of the ${cat.limit > 0 ? fmt(cat.limit) + ' limit' : 'spend'} counts as used \u2014 handy for money a friend chips in.`
              : "This adds to your account balance right away, e.g. when your salary comes in."}
          </div>
        </div>
        {isCategory && (
          <div>
            <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Note (optional)</label>
            <input type="text" placeholder="e.g. Friend's share for petrol" value={note} onChange={e => setNote(e.target.value)}
              style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }} className="w-full mt-1.5 rounded-lg px-3 py-2.5 text-sm outline-none" />
          </div>
        )}
        <button onClick={handleSave} disabled={!amount || Number(amount) <= 0}
          style={{ background: (!amount || Number(amount) <= 0) ? C.surface2 : C.positive, color: (!amount || Number(amount) <= 0) ? C.faint : C.base }}
          className="w-full py-3 rounded-xl text-sm font-semibold">Add money</button>
      </div>
    </Sheet>
  );
}
function CategoryModal({ category, onClose, onSave, onDelete }) {
  const [name, setName] = useState(category ? category.name : '');
  const [color, setColor] = useState(category ? category.color : SWATCHES[0]);
  const [icon, setIcon] = useState(category && category.icon ? category.icon : ICONS[0]);
  const [limit, setLimit] = useState(category && category.limit ? String(category.limit) : '');
  const [subcats, setSubcats] = useState((category && category.subcategories) || []);
  const [newSub, setNewSub] = useState('');
  const [confirmDel, setConfirmDel] = useState(false);

  function addSub() {
    const val = newSub.trim();
    if (!val) return;
    setSubcats(prev => [...prev, { id: uid(), name: val }]);
    setNewSub('');
  }
  function removeSub(id) { setSubcats(prev => prev.filter(s => s.id !== id)); }

  return (
    <Sheet title={category ? 'Edit category' : 'New category'} onClose={onClose}>
      <div className="flex flex-col gap-4">
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Name</label>
          <input type="text" placeholder="e.g. Travel" value={name} onChange={e => setName(e.target.value)}
            style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }} className="w-full mt-1.5 rounded-lg px-3 py-2.5 text-sm outline-none" />
        </div>
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Icon</label>
          <div className="flex flex-wrap gap-2 mt-1.5">
            {ICONS.map(ic => (
              <button key={ic} onClick={() => setIcon(ic)}
                style={{ background: icon === ic ? color + '33' : C.surface2, border: `1px solid ${icon === ic ? color : C.border}`, width: 36, height: 36, borderRadius: 10 }}
                className="flex items-center justify-center text-lg">{ic}</button>
            ))}
          </div>
        </div>
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Color</label>
          <div className="flex flex-wrap gap-2 mt-1.5">
            {SWATCHES.map(s => (
              <button key={s} onClick={() => setColor(s)}
                style={{ background: s, width: 28, height: 28, borderRadius: 999, border: color === s ? `2px solid ${C.text}` : '2px solid transparent' }}></button>
            ))}
          </div>
        </div>
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Monthly limit (optional)</label>
          <div className="flex items-center mt-1.5">
            <span className="font-mono text-lg mr-1.5" style={{ color: C.muted }}>{'\u20B9'}</span>
            <input type="number" inputMode="decimal" placeholder="No limit" value={limit} onChange={e => setLimit(e.target.value)}
              style={{ background: 'transparent', color: C.text }} className="font-mono text-lg w-full outline-none" />
          </div>
          <div style={{ height: 1, background: C.border }} className="mt-1"></div>
          <div className="text-[11px] mt-2" style={{ color: C.faint }}>You'll get a notice at 80% and when you go over.</div>
        </div>
        <div>
          <label style={{ color: C.faint }} className="text-[10px] font-semibold uppercase tracking-wider">Subcategories (optional)</label>
          <div className="text-[11px] mt-1" style={{ color: C.faint }}>e.g. under Household: Kirana, Electricity Bills</div>
          {subcats.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-2">
              {subcats.map(s => (
                <span key={s.id} style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} className="pl-3 pr-1.5 py-1 rounded-full text-xs font-medium flex items-center gap-1">
                  {s.name}
                  <button onClick={() => removeSub(s.id)} style={{ color: C.faint }} className="p-0.5"><X size={11} /></button>
                </span>
              ))}
            </div>
          )}
          <div className="flex gap-2 mt-2">
            <input type="text" placeholder="e.g. Kirana" value={newSub}
              onChange={e => setNewSub(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addSub(); } }}
              style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" />
            <button onClick={addSub} style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} className="px-3 rounded-lg text-sm font-medium">Add</button>
          </div>
        </div>
        <button onClick={() => onSave({ id: category ? category.id : uid(), name: name.trim() || 'Untitled', color, icon, limit: Number(limit) || 0, subcategories: subcats })} disabled={!name.trim()}
          style={{ background: !name.trim() ? C.surface2 : C.positive, color: !name.trim() ? C.faint : C.base }} className="w-full py-3 rounded-xl text-sm font-semibold">Save category</button>
        {onDelete && (confirmDel
          ? <button onClick={onDelete} style={{ color: C.danger, border: `1px solid ${C.danger}` }} className="w-full py-2.5 rounded-xl text-sm font-semibold">Confirm delete</button>
          : <button onClick={() => setConfirmDel(true)} style={{ color: C.faint }} className="w-full py-1 text-xs font-medium">Delete category</button>)}
      </div>
    </Sheet>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Ledger />);
</script>

<script>
  // Manually transform the JSX source with the "classic" runtime so Babel
  // outputs React.createElement(...) calls instead of an ES "import" statement
  // (the automatic runtime, which some CDN Babel versions default to, injects
  // an import that fails since this runs as a plain script, not a module).
  var source = document.getElementById('app-source').textContent;
  var compiled = Babel.transform(source, {
    presets: [['react', { runtime: 'classic' }]]
  }).code;
  var script = document.createElement('script');
  script.textContent = compiled;
  document.body.appendChild(script);
</script>
</body>
</html>
